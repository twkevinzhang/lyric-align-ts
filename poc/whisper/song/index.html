<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>Amazing Grace 實際歌曲驗證</title>
<style>body{font:18px system-ui;max-width:850px;margin:48px auto;padding:24px;background:#fafafa;color:#222}button{font:inherit;padding:12px}pre{white-space:pre-wrap}</style>
<h1>Amazing Grace 實際歌曲驗證</h1><p id="config">載入測試設定</p>
<p>Chrome 執行 WASM 模型推論；Node.js 執行分段、歌詞引導解碼與 DTW。標準 SRT 僅用於完成後評分。</p>
<button id="run" disabled>開始完整音檔推論</button> <button id="cancel" disabled>停止測試</button><pre id="status">準備就緒</pre>
<script type="module">
const button=document.querySelector('#run'),cancel=document.querySelector('#cancel'),status=document.querySelector('#status');
const config=await(await fetch('/config')).json();
document.querySelector('#config').textContent=`small 多語 Q5_1 · CPU ${config.threads} 執行緒 · ${config.variant} · ${config.calibrate?'30 秒執行緒校準':'完整音檔對齊'}`;
button.textContent=config.calibrate?'開始執行緒校準':'開始完整音檔推論';button.disabled=false;
let worker,timer,finished=false;
const cleanup=()=>{clearInterval(timer);worker?.terminate();worker=undefined;cancel.disabled=true;};
const stop=()=>{if(finished||!worker)return;finished=true;fetch(`/cancel?run=${config.runId}`,{method:'POST',body:'使用者停止測試',keepalive:true}).catch(()=>{});cleanup();status.textContent='測試已停止';};
cancel.onclick=stop;addEventListener('pagehide',stop);
button.onclick=()=>{
  button.disabled=true;cancel.disabled=false;worker=new Worker('/worker.js');
  worker.onmessage=e=>{status.textContent=e.data;if(e.data==='完成'||e.data.startsWith('失敗')){finished=true;cleanup();}};
  worker.onerror=e=>{status.textContent=`失敗：${e.message}`;fetch(`/error?run=${config.runId}`,{method:'POST',body:e.message}).catch(()=>{});finished=true;cleanup();};
  worker.postMessage(config);
  timer=setInterval(async()=>{try{const data=await(await fetch('/status')).json();status.textContent=`${data.status}\n已完成 ${data.metrics.encodeCalls} 段 encoder、${data.metrics.decodeCalls} 次 decoder\n模型計算 ${((data.metrics.encodeMs+data.metrics.decodeMs)/1000).toFixed(1)} 秒`;if(data.complete||data.status.startsWith('失敗')){finished=true;cleanup();}}catch(e){status.textContent=`連線失敗：${e.message}`;stop();}},3000);
};
</script></html>
